<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi tiêu gia đình</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 0 16px 150px; background: #f6f7f9; color: #222; }
  #mic { flex: 1; padding: 18px; font-size: 18px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; }
  #mic.on { background: #d93025; }
  #live { min-height: 20px; margin-bottom: 8px; color: #666; font-style: italic; }
  /* Thanh dưới cùng, cố định để bấm bằng ngón cái */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
            background: #f6f7f9; box-shadow: 0 -2px 8px rgba(0,0,0,.08); z-index: 5; }
  #actions { display: flex; gap: 8px; }
  #scan { padding: 0 14px; font-size: 16px; border: 0; border-radius: 12px; background: #188038; color: #fff; }
  #delsel { display: none; padding: 0 16px; font-size: 16px; border: 0; border-radius: 12px; background: #d93025; color: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .row button, #export { padding: 10px 14px; font-size: 16px; border: 0; border-radius: 8px; background: #188038; color: #fff; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; background: #fff; font-size: 15px; }
  th, td { border-bottom: 1px solid #eee; padding: 0 4px; height: 40px; text-align: left; overflow: hidden; }
  td.money, th.money { text-align: right; }
  td[contenteditable] { outline: none; }
  col.c-chk { width: 36px; } col.c-stt { width: 36px; } col.c-ngay { width: 58px; } col.c-tien { width: 96px; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; }
  /* Phần đầu bảng cố định khi cuộn: tiêu đề, tháng, tên cột (mỗi hàng cao 40px) */
  thead th { position: sticky; background: #fff; z-index: 2; }
  tr.r-title th { top: 0;    font-size: 20px; background: #f6f7f9; border-bottom: 0; }
  tr.r-month th { top: 40px; background: #e8f0fe; color: #174ea6; text-align: center; }
  tr.r-cols  th { top: 80px; }
  tr.sep td { background: #e8f0fe; color: #174ea6; font-weight: bold; text-align: center; }
  /* Khung xem lại kết quả quét ảnh */
  #xem { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: flex-end; }
  #xem.mo { display: flex; }
  #xem .hop { background: #fff; width: 100%; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; max-height: 90vh; overflow: auto; }
  #xem label { display: block; font-size: 13px; color: #666; margin-top: 10px; }
  #xem input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  #xem .nut { display: flex; gap: 8px; margin-top: 16px; }
  #xem .nut button { flex: 1; padding: 14px; font-size: 16px; border: 0; border-radius: 10px; color: #fff; background: #188038; }
  #xem .nut button.huy { background: #888; }
  #xem pre { white-space: pre-wrap; font-size: 12px; color: #555; }
  tr.tong td { font-weight: bold; background: #fafafa; }
  tfoot td { font-weight: bold; }
  #export { width: 100%; margin: 12px 0; }
</style>
</head>
<body>
<div class="row" style="margin-top:16px">
  <input id="manual" placeholder="Gõ hoặc bấm micro trên bàn phím" enterkeyhint="done">
  <button id="add">Thêm</button>
</div>
<table>
  <colgroup><col class="c-chk"><col class="c-stt"><col class="c-ngay"><col><col class="c-tien"></colgroup>
  <thead>
    <tr class="r-title"><th colspan="5">Chi tiêu gia đình</th></tr>
    <tr class="r-month"><th colspan="5" id="thang"></th></tr>
    <tr class="r-cols">
      <th><input type="checkbox" id="chkall" aria-label="Chọn tất cả"></th>
      <th>STT</th><th>Ngày</th><th>Nội dung</th><th class="money">Số tiền</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
  <tfoot><tr><td></td><td></td><td></td><td>Tổng cộng</td><td class="money" id="total"></td></tr></tfoot>
</table>
<button id="export">Xuất Excel</button>

<div id="bottom">
  <div id="live"></div>
  <div id="actions">
    <button id="mic">Bấm để nói</button>
    <button id="scan">Quét ảnh</button>
    <button id="delsel">Xóa</button>
  </div>
</div>

<input type="file" id="anh" accept="image/*" hidden>
<div id="xem">
  <div class="hop">
    <b>Kết quả quét ảnh</b> <span style="color:#666;font-size:13px">(kiểm tra lại trước khi thêm)</span>
    <label>Nội dung</label><input id="x-nd">
    <label>Số tiền</label><input id="x-st" inputmode="numeric">
    <label>Ngày (dd/mm hoặc dd/mm/yyyy)</label><input id="x-ngay" inputmode="numeric">
    <div id="x-loi" style="color:#d93025;font-size:13px;margin-top:6px"></div>
    <details style="margin-top:10px"><summary style="font-size:13px;color:#666">Chữ máy đọc được</summary><pre id="x-tho"></pre></details>
    <div class="nut"><button class="huy" id="x-huy">Hủy</button><button id="x-them">Thêm vào bảng</button></div>
  </div>
</div>

<script src="brands.js"></script>
<script src="ocr.js"></script>
<script src="parse.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY = 'chitieu';
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
const fmt = n => n.toLocaleString('vi-VN');
const pad = n => String(n).padStart(2, '0');
const ngay = iso => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
items.forEach(it => { if (!it.id) it.id = newId(); });   // dữ liệu cũ chưa có id
const chon = new Set();                                     // id các dòng đang được tích

// "23/10", "23.10", "2310", "23/10/2026" -> Date mới (giữ giờ cũ, giữ năm cũ nếu không nhập năm); sai -> null
function parseNgay(text, iso) {
  const old = new Date(iso);
  const m = text.trim().match(/^(\d{1,2})\s*[\/.\-\s]?\s*(\d{1,2})(?:\s*[\/.\-\s]?\s*(\d{4}))?$/);
  if (!m) return null;
  const [d, mo, y] = [+m[1], +m[2], m[3] ? +m[3] : old.getFullYear()];
  const nd = new Date(old); nd.setFullYear(y, mo - 1, d);
  return nd.getDate() === d && nd.getMonth() === mo - 1 ? nd : null;
}

// Khóa tháng của một khoản: "10/2026"
const thangCua = iso => { const d = new Date(iso); return `${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
// Luôn xếp theo ngày (Array.sort ổn định nên cùng ngày giữ thứ tự ghi)
const xepNgay = () => items.sort((a, b) => new Date(a.thoiGian) - new Date(b.thoiGian));
xepNgay();

// Dòng tháng cố định trên đầu bảng luôn hiện tháng của khoản đang nằm ngay dưới nó
function capNhatThang() {
  const th = document.getElementById('thang');
  const duoi = document.querySelector('tr.r-cols th').getBoundingClientRect().bottom;
  const dong = [...document.querySelectorAll('#list tr')].find(tr => tr.getBoundingClientRect().bottom > duoi + 1);
  const key = dong ? dong.dataset.thang : (items.length ? thangCua(items[items.length - 1].thoiGian) : thangCua(new Date().toISOString()));
  th.textContent = 'Tháng ' + key;
}
window.addEventListener('scroll', capNhatThang, { passive: true });

function capNhatChon() {
  const n = chon.size, btn = document.getElementById('delsel');
  btn.style.display = n ? 'block' : 'none';
  btn.textContent = `Xóa (${n})`;
  const all = document.getElementById('chkall');
  all.checked = n > 0 && n === items.length;
  all.indeterminate = n > 0 && n < items.length;
}

// Gom theo tháng (items đã xếp theo ngày): [{ key, ds: [item...], tong }]
function nhomThang() {
  const nhom = [];
  for (const it of items) {
    const key = thangCua(it.thoiGian);
    let g = nhom[nhom.length - 1];
    if (!g || g.key !== key) nhom.push(g = { key, ds: [], tong: 0 });
    g.ds.push(it); g.tong += it.soTien;
  }
  return nhom;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const nhom = nhomThang();
  nhom.forEach((g, gi) => {
    if (gi > 0) {                                              // sang tháng mới: dòng ngăn
      const sep = document.createElement('tr');
      sep.className = 'sep'; sep.dataset.thang = g.key;
      sep.innerHTML = `<td colspan="5">Tháng ${g.key}</td>`;
      list.appendChild(sep);
    }
    g.ds.forEach((it, i) => {
      const tr = document.createElement('tr');
      tr.dataset.thang = g.key;
      tr.innerHTML = `<td><input type="checkbox" ${chon.has(it.id) ? 'checked' : ''}></td><td>${i + 1}</td>
        <td contenteditable inputmode="numeric">${ngay(it.thoiGian)}</td>
        <td contenteditable>${esc(it.noiDung)}</td>
        <td class="money" contenteditable inputmode="numeric">${fmt(it.soTien)}</td>`;
      const [ck, , dt, nd, st] = tr.children;
      ck.firstChild.onchange = e => { e.target.checked ? chon.add(it.id) : chon.delete(it.id); capNhatChon(); };
      dt.onblur = () => {
        const d = parseNgay(dt.textContent, it.thoiGian);
        if (d) { it.thoiGian = d.toISOString(); xepNgay(); save(); }
        render();                                           // sai định dạng thì hiện lại ngày cũ
      };
      nd.onblur = () => {
        const moi = nd.textContent.trim();
        if (moi !== it.noiDung) learnFix(it.noiDung, moi);   // nhớ cách sửa cho lần sau
        it.noiDung = moi; save();
      };
      st.onblur = () => { it.soTien = Number(st.textContent.replace(/\D/g, '')) || 0; save(); render(); };
      list.appendChild(tr);
    });
    const tong = document.createElement('tr');                // tổng riêng của tháng
    tong.className = 'tong'; tong.dataset.thang = g.key;
    tong.innerHTML = `<td colspan="4">Tổng tháng ${g.key}</td><td class="money">${fmt(g.tong)}</td>`;
    list.appendChild(tong);
  });
  // Tổng cộng chỉ cần khi có từ 2 tháng trở lên
  document.querySelector('tfoot').style.display = nhom.length > 1 ? '' : 'none';
  document.getElementById('total').textContent = fmt(items.reduce((s, it) => s + it.soTien, 0));
  capNhatChon();
  capNhatThang();
}

document.getElementById('chkall').onchange = e => {
  chon.clear();
  if (e.target.checked) items.forEach(it => chon.add(it.id));
  render();
};
document.getElementById('delsel').onclick = () => {
  if (!chon.size || !confirm(`Xóa ${chon.size} dòng đã chọn?`)) return;
  items = items.filter(it => !chon.has(it.id));
  chon.clear(); save(); render();
};

function addText(text) {
  if (!text.trim()) return;
  const r = parseExpense(fixBrands(text));
  items.push({ ...r, id: newId(), thoiGian: new Date().toISOString(), cauGoc: text });
  xepNgay(); save(); render();
}

// Bấm Enter / Xong trên bàn phím cũng thêm dòng
document.getElementById('manual').onkeydown = e => { if (e.key === 'Enter') document.getElementById('add').click(); };

document.getElementById('add').onclick = () => {
  const inp = document.getElementById('manual');
  addText(inp.value); inp.value = '';
};

// Nhận giọng nói
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic'), live = document.getElementById('live');
let rec = null, listening = false;
if (!SR) {
  mic.disabled = true; mic.textContent = 'Trình duyệt không hỗ trợ giọng nói';
} else {
  rec = new SR();
  rec.lang = 'vi-VN';
  rec.interimResults = true;
  // iPhone: nghe liên tục chạy không ổn định -> mỗi lần bấm ghi 1 khoản
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  rec.continuous = !isIOS;
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { addText(t); live.textContent = ''; }
      else live.textContent = t;
    }
  };
  rec.onend = () => {
    if (listening && !isIOS) return rec.start();       // Android: tự bật lại khi trình duyệt ngắt
    listening = false; mic.classList.remove('on'); mic.textContent = 'Bấm để nói';
  };
  rec.onerror = e => {
    if (e.error === 'service-not-allowed' || e.error === 'not-allowed') {
      // iOS chặn nhận giọng của web -> dùng micro của bàn phím iPhone
      listening = false;
      live.textContent = 'iPhone chặn nhận giọng trên web. Bấm vào ô bên dưới, chọn biểu tượng micro trên bàn phím để đọc, rồi bấm Xong.';
      document.getElementById('manual').focus();
    } else live.textContent = 'Lỗi: ' + e.error;
  };
  mic.onclick = () => {
    listening = !listening;
    mic.classList.toggle('on', listening);
    mic.textContent = listening ? 'Đang nghe... bấm để dừng' : 'Bấm để nói';
    listening ? rec.start() : rec.stop();
  };
}

// Quét ảnh hóa đơn / chuyển khoản: đọc chữ ngay trên máy (Tesseract), sau đó cho Hoan xem lại
const taiScript = src => new Promise((ok, loi) => {
  const el = document.createElement('script');
  el.src = src; el.onload = ok; el.onerror = () => loi(new Error('Không tải được ' + src));
  document.head.appendChild(el);
});
let worker = null, tienDo = () => {};
async function docChu(canvas) {
  if (!worker) {
    if (!window.Tesseract) await taiScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
    worker = await Tesseract.createWorker('vie', 1, { logger: m => tienDo(m) });
  }
  return (await worker.recognize(canvas)).data.text;
}
// Thu nhỏ ảnh (ảnh iPhone rất lớn, đọc chậm) và tự xoay đúng chiều
async function thuNho(file, max = 1800) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}

const $ = id => document.getElementById(id);
$('scan').onclick = () => $('anh').click();
$('anh').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';                                    // cho phép chọn lại cùng một ảnh
  if (!file) return;
  const live = $('live');
  try {
    live.textContent = 'Đang chuẩn bị đọc ảnh (lần đầu cần tải dữ liệu tiếng Việt)...';
    tienDo = m => { live.textContent = m.status === 'recognizing text' ? `Đang đọc ảnh... ${Math.round(m.progress * 100)}%` : 'Đang tải dữ liệu đọc chữ...'; };
    const text = await docChu(await thuNho(file));
    live.textContent = '';
    moKhungXem(text);
  } catch (err) {
    live.textContent = 'Không đọc được ảnh: ' + err.message;
  }
};

function moKhungXem(text) {
  const r = parseBill(text);
  const hom = new Date();
  $('x-nd').value = r.noiDung;
  $('x-st').value = r.soTien ? fmt(r.soTien) : '';
  $('x-ngay').value = r.ngay ? `${pad(r.ngay.d)}/${pad(r.ngay.m)}/${r.ngay.y}` : `${pad(hom.getDate())}/${pad(hom.getMonth() + 1)}`;
  $('x-tho').textContent = text.trim() || '(không đọc được chữ nào)';
  $('x-loi').textContent = r.soTien ? '' : 'Không tìm thấy số tiền, Hoan nhập tay giúp mình.';
  $('xem').classList.add('mo');
}
$('x-huy').onclick = () => $('xem').classList.remove('mo');
$('x-them').onclick = () => {
  const st = Number($('x-st').value.replace(/\D/g, '')) || 0;
  const d = parseNgay($('x-ngay').value, new Date().toISOString());
  if (!$('x-nd').value.trim() || !st) { $('x-loi').textContent = 'Cần có Nội dung và Số tiền.'; return; }
  if (!d) { $('x-loi').textContent = 'Ngày chưa đúng, vd 23/10 hoặc 23/10/2026.'; return; }
  items.push({ id: newId(), noiDung: $('x-nd').value.trim(), soTien: st, thoiGian: d.toISOString(), cauGoc: 'quét ảnh' });
  xepNgay(); save(); render();
  $('xem').classList.remove('mo');
};

// Xuất Excel: mỗi tháng một nhóm (STT bắt đầu từ 1) kèm dòng tổng tháng
document.getElementById('export').onclick = () => {
  const aoa = [['STT', 'Ngày', 'Nội dung', 'Số tiền']];
  const ngayCells = [], tienCells = [];                    // [chỉ số dòng] cần định dạng
  const nhom = nhomThang();
  nhom.forEach((g, gi) => {
    if (gi > 0) aoa.push([]);
    aoa.push([`Tháng ${g.key}`]);
    g.ds.forEach((it, i) => {
      const d = new Date(it.thoiGian);
      // Ngày thật của Excel (lọc/sắp xếp được), hiển thị dd/mm
      const serial = (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000;
      aoa.push([i + 1, serial, it.noiDung, it.soTien]);
      ngayCells.push(aoa.length); tienCells.push(aoa.length);
    });
    aoa.push(['', '', `Tổng tháng ${g.key}`, g.tong]); tienCells.push(aoa.length);
  });
  if (nhom.length > 1) {
    aoa.push([]);
    aoa.push(['', '', 'Tổng cộng', items.reduce((s, it) => s + it.soTien, 0)]); tienCells.push(aoa.length);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 5 }, { wch: 8 }, { wch: 35 }, { wch: 15 }];
  ngayCells.forEach(r => { ws['B' + r].z = 'dd/mm'; });
  tienCells.forEach(r => { ws['D' + r].z = '#,##0'; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Chi tiêu');
  XLSX.writeFile(wb, `chi-tieu-${new Date().toISOString().slice(0, 10)}.xlsx`);
};

render();
</script>
</body>
</html>
