<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi tiêu gia đình</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 0 16px 210px; background: #f6f7f9; color: #222; }
  #live { min-height: 20px; margin-bottom: 6px; color: #666; font-style: italic; font-size: 14px; }
  /* Thanh dưới cùng, cố định để bấm bằng ngón cái */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
            background: #f6f7f9; box-shadow: 0 -2px 8px rgba(0,0,0,.08); z-index: 5; }
  .ng-dong { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ng-dong label { font-size: 14px; color: #555; white-space: nowrap; }
  .ng-dong select { flex: 1; min-width: 0; height: 40px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; background: #fff; padding: 0 8px; }
  .ng-dong button { height: 40px; padding: 0 14px; font-size: 15px; border: 1px solid #ccc; border-radius: 10px; background: #fff; color: #174ea6; }
  #actions { display: flex; gap: 10px; }
  #mic, #scan { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; padding: 0; font-size: 17px; border: 0; border-radius: 14px; color: #fff; }
  #mic { background: #1a73e8; }
  #mic.on { background: #d93025; }
  #scan { background: #188038; }
  #mic svg, #scan svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  #delsel { display: none; width: 100%; height: 44px; margin-bottom: 8px; font-size: 16px; border: 0; border-radius: 12px; background: #d93025; color: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .row button, #export { padding: 10px 14px; font-size: 16px; border: 0; border-radius: 8px; background: #188038; color: #fff; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; background: #fff; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 4px 3px; height: 40px; text-align: left; overflow: hidden; line-height: 1.25; word-break: break-word; }
  thead th { white-space: nowrap; padding: 0 2px; font-size: 13px; text-align: center; }
  td.c { text-align: center; white-space: nowrap; }
  /* Mọi ô dữ liệu dùng cùng một cỡ chữ, kiểu chữ, màu chữ */
  tbody td, tfoot td { font: 14px/1.25 system-ui, sans-serif; color: #222; }
  .ng-hien.trong { color: #aaa; }
  tr.tong td, tfoot td { white-space: nowrap; }
  #list tr:not(.sep):not(.tong) td:nth-child(5) { padding-left: 8px; }
  td.money, th.money { text-align: right; white-space: nowrap; }
  td[contenteditable] { outline: none; }
  col.c-chk { width: 26px; } col.c-stt { width: 24px; } col.c-ngay { width: 52px; } col.c-tien { width: 88px; } col.c-nguon { width: 44px; }
  td.nguon { position: relative; }
  .ng-hien { display: block; font: inherit; color: inherit; white-space: nowrap; overflow: hidden; text-align: center; padding-right: 7px; }
  .ng-hien.trong { color: #aaa; }
  td.nguon::after { content: '\25BE'; color: #888; position: absolute; right: 1px; top: 50%; transform: translateY(-50%); font-size: 9px; pointer-events: none; }
  /* Chọn nguồn: select trong suốt phủ lên chữ để iPhone mở bảng chọn mà không bị phóng to trang */
  .ng-chon { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; }
  /* Ô tick tròn nhỏ; bấm vào cả ô chứa nó cũng được chọn */
  input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 11px; height: 11px; margin: 0; border: 1.5px solid #888; border-radius: 50%; background: #fff; vertical-align: middle; }
  input[type=checkbox]:checked { background: #1a73e8; border-color: #1a73e8; box-shadow: inset 0 0 0 2px #fff; }
  input[type=checkbox]:indeterminate { border-color: #1a73e8; background: linear-gradient(#1a73e8, #1a73e8) center / 5px 2px no-repeat #fff; }
  /* Phần đầu bảng cố định khi cuộn: tiêu đề, tháng, tên cột (mỗi hàng cao 40px) */
  thead th { position: sticky; background: #fff; z-index: 2; }
  tr.r-title th { top: 0;    font-size: 20px; text-align: center; background: #f6f7f9; border-bottom: 0; }
  tr.r-month th { top: 40px; background: #e8f0fe; color: #174ea6; text-align: center; }
  tr.r-cols  th { top: 80px; }
  tr.sep td { background: #e8f0fe; color: #174ea6; font-weight: bold; text-align: center; }
  /* Khung xem lại kết quả quét ảnh */
  #xem, #ql { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; align-items: flex-end; }
  #xem.mo, #ql.mo { display: flex; }
  #xem .hop, #ql .hop { box-sizing: border-box; max-width: 100%; background: #fff; width: 100%; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; max-height: 90vh; overflow: auto; }
  #xem label { display: block; font-size: 13px; color: #666; margin-top: 10px; }
  #xem input, #ql input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  #xem .nut, #ql .nut { display: flex; gap: 8px; margin-top: 16px; }
  #xem .nut button, #ql .nut button { flex: 1; padding: 14px; font-size: 16px; border: 0; border-radius: 10px; color: #fff; background: #188038; }
  #xem .nut button.huy { background: #888; }
  .ql-dong { display: flex; gap: 8px; margin-top: 8px; }
  .ql-dong button { width: 44px; border: 0; border-radius: 8px; background: #fce8e6; color: #d93025; font-size: 20px; }
  #xem .the-nguon { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  #xem .the { border: 1px solid #ddd; border-radius: 10px; padding: 4px 10px 10px; margin-top: 12px; }
  #xem .the-anh { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; flex: none; background: #eee; }
  #xem .the-tieu { flex: 1; font-size: 14px; }
  #phong { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 30; }
  #phong.mo { display: block; }
  #phong .khung { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  #phong img { display: block; width: 100%; }
  #phong img.zoom { width: 250%; max-width: none; }
  #phong-dong { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 31; width: 40px; height: 40px; border: 0; border-radius: 20px; background: rgba(255,255,255,.9); font-size: 22px; }
  #phong-goi { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); text-align: center; color: #ddd; font-size: 13px; z-index: 31; pointer-events: none; }
  #xem .the-dau { gap: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-weight: bold; font-size: 14px; }
  #xem .the-dau button { background: none; border: 0; color: #d93025; font-size: 14px; }
  #xem .loi { color: #d93025; font-size: 13px; margin-top: 6px; }
  #xem pre { white-space: pre-wrap; font-size: 12px; color: #555; }
  tr.tong td { font-weight: bold; background: #fafafa; }
  tfoot td { font-weight: bold; }
  #export { width: 100%; margin: 12px 0; }
  #dongbo { margin-top: 10px; padding: 6px 10px; font-size: 13px; color: #555; background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dongbo.loi { color: #d93025; border-color: #f3c3bf; }
  #dn { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; align-items: center; justify-content: center; padding: 16px; }
  #dn.mo { display: flex; }
  #dn .hop { box-sizing: border-box; width: 100%; max-width: 360px; background: #fff; border-radius: 14px; padding: 16px; }
  #dn input { box-sizing: border-box; width: 100%; margin: 6px 0; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  #dn button { padding: 10px 14px; font-size: 16px; border: 0; border-radius: 8px; background: #188038; color: #fff; margin-top: 6px; }
  #dn button.phu { background: #eee; color: #222; }
  #dn-loi { color: #d93025; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div id="dongbo">Chưa đồng bộ — chạm để đăng nhập</div>
<div class="row" style="margin-top:10px">
  <input id="manual" placeholder="Gõ hoặc bấm micro trên bàn phím" enterkeyhint="done">
  <button id="add">Thêm</button>
</div>
<table>
  <colgroup><col class="c-chk"><col class="c-stt"><col class="c-ngay"><col class="c-nguon"><col><col class="c-tien"></colgroup>
  <thead>
    <tr class="r-title"><th colspan="6">Chi tiêu gia đình</th></tr>
    <tr class="r-month"><th colspan="6" id="thang"></th></tr>
    <tr class="r-cols">
      <th><input type="checkbox" id="chkall" aria-label="Chọn tất cả"></th>
      <th>No</th><th>Ngày</th><th>Nguồn</th><th>Nội dung</th><th class="money">Số tiền</th>
    </tr>
  </thead>
  <tbody id="list"></tbody>
  <tfoot><tr><td colspan="5">Tổng cộng</td><td class="money" id="total"></td></tr></tfoot>
</table>
<button id="export">Xuất Excel</button>

<div id="bottom">
  <div id="live"></div>
  <div class="ng-dong">
    <label for="nguon-md">Nguồn tiền</label>
    <select id="nguon-md"></select>
    <button id="ng-sua">Sửa</button>
  </div>
  <button id="delsel">Xóa</button>
  <div id="actions">
    <button id="mic">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="mic-t">Bấm để nói</span>
    </button>
    <button id="scan">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Quét ảnh</span>
    </button>
  </div>
</div>

<div id="dn">
  <div class="hop">
    <b>Đồng bộ với vợ/chồng</b>
    <div id="dn-ai" style="font-size:14px;color:#555;margin-top:6px"></div>
    <div id="dn-form">
      <input id="dn-email" type="email" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="Email">
      <input id="dn-pw" type="password" autocomplete="current-password" placeholder="Mật khẩu (từ 6 ký tự)">
      <button id="dn-vao">Đăng nhập</button> <button id="dn-moi" class="phu">Tạo tài khoản</button>
    </div>
    <div id="dn-loi"></div>
    <div id="dn-xong"><button id="dn-lai">Đồng bộ ngay</button> <button id="dn-ra" class="phu">Đăng xuất</button></div>
    <button id="dn-dong" class="phu">Đóng</button>
  </div>
</div>

<div id="ql">
  <div class="hop">
    <b>Danh sách nguồn tiền</b> <span style="color:#666;font-size:13px">(áp dụng cho cả cột)</span>
    <div id="ql-ds"></div>
    <div class="ql-dong"><input id="ql-moi" placeholder="Thêm nguồn mới, vd Techcombank"><button id="ql-them" style="background:#e6f4ea;color:#188038">+</button></div>
    <div class="nut"><button id="ql-xong">Xong</button></div>
  </div>
</div>

<div id="phong"><button id="phong-dong" aria-label="Đóng">×</button><div class="khung"><img id="phong-anh" alt=""></div><div id="phong-goi">Chạm vào ảnh để phóng to / thu nhỏ</div></div>
<input type="file" id="anh" accept="image/*" multiple hidden>
<div id="xem">
  <div class="hop">
    <b>Kết quả quét ảnh</b> <span style="color:#666;font-size:13px">(kiểm tra lại trước khi thêm)</span>
    <div id="x-ds"></div>
    <div class="nut"><button class="huy" id="x-huy">Hủy</button><button id="x-them">Thêm vào bảng</button></div>
  </div>
</div>

<script src="brands.js"></script>
<script src="ocr.js"></script>
<script src="parse.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY = 'chitieu';
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
const fmt = n => n.toLocaleString('vi-VN');
const pad = n => String(n).padStart(2, '0');
const ngay = iso => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} window.dongBo?.hen(); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
items.forEach(it => { if (!it.id) it.id = newId(); });   // dữ liệu cũ chưa có id
const chon = new Set();                                     // id các dòng đang được tích

// ----- Nguồn tiền: danh sách dùng chung cho cả cột, mỗi dòng chọn một nguồn -----
const NGUON_MAC = ['Vợ', 'Chồng', 'Visa Online', 'mDigi', 'Shinhan', 'HSBC'];
const docLS = (k, mac) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? mac; } catch { return mac; } };
const ghiLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let nguonDs = docLS('nguon_ds', NGUON_MAC);
let nguonMd = docLS('nguon_md', '');                      // nguồn mặc định: các khoản mới (nói, gõ, quét ảnh) tự điền
items.forEach(it => { if (it.nguon === undefined) it.nguon = ''; });
const luuNguon = () => { ghiLS('nguon_ds', nguonDs); ghiLS('nguon_md', nguonMd); window.dongBo?.hen(); };

function tuyChonNguon(chon) {
  const ds = chon && !nguonDs.includes(chon) ? [...nguonDs, chon] : nguonDs;   // nguồn đã bị xóa khỏi danh sách vẫn hiện ở dòng đang dùng
  return '<option value="">(trống)</option>' + ds.map(n => `<option${n === chon ? ' selected' : ''}>${esc(n)}</option>`).join('')
       + '<option value="__them__">+ Thêm nguồn mới...</option>';
}
// Thêm nguồn mới bằng ô nhập; trả về tên (đã có thì dùng lại tên cũ), hoặc null nếu hủy
function themNguon(ten) {
  const t = (ten ?? prompt('Tên nguồn tiền mới (vd Techcombank):') ?? '').trim();
  if (!t) return null;
  const co = nguonDs.find(n => n.toLowerCase() === t.toLowerCase());
  if (co) return co;
  nguonDs.push(t); luuNguon();
  return t;
}
// Gắn dropdown: chọn có sẵn hoặc "+ Thêm nguồn mới"; khiDoi(giá trị) cập nhật dữ liệu
function ganNguon(sel, hienTai, khiDoi) {
  sel.innerHTML = tuyChonNguon(hienTai);
  sel.onchange = () => {
    let v = sel.value;
    if (v === '__them__') {
      v = themNguon();
      if (v === null) { sel.innerHTML = tuyChonNguon(hienTai); return; }
      khiDoi(v); lamMoiNguon();                           // danh sách đổi -> làm mới mọi dropdown của cột
      return;
    }
    hienTai = v; khiDoi(v);
  };
}
// Vẽ lại mọi nơi có danh sách nguồn: ô mặc định, bảng, các thẻ quét ảnh đang mở
function lamMoiNguon() {
  ganNguon(document.getElementById('nguon-md'), nguonMd, v => { nguonMd = v; luuNguon(); });
  document.querySelectorAll('#x-ds .the').forEach(the => {
    ganNguon(the.querySelector('.the-nguon'), the.dataset.nguon || '', v => { the.dataset.nguon = v; });
    the.querySelector('.the-nguon').value = the.dataset.nguon || '';
  });
  render();
}


// "23/10", "23.10", "2310", "23/10/2026" -> Date mới (giữ giờ cũ, giữ năm cũ nếu không nhập năm); sai -> null
function parseNgay(text, iso) {
  const old = new Date(iso);
  const m = text.trim().match(/^(\d{1,2})\s*[\/.\-\s]?\s*(\d{1,2})(?:\s*[\/.\-\s]?\s*(\d{4}))?$/);
  if (!m) return null;
  const [d, mo, y] = [+m[1], +m[2], m[3] ? +m[3] : old.getFullYear()];
  const nd = new Date(old); nd.setFullYear(y, mo - 1, d);
  return nd.getDate() === d && nd.getMonth() === mo - 1 ? nd : null;
}

// Khóa tháng của một khoản: "10/2026"
const thangCua = iso => { const d = new Date(iso); return `${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
// Luôn xếp theo ngày (Array.sort ổn định nên cùng ngày giữ thứ tự ghi)
const xepNgay = () => items.sort((a, b) => new Date(a.thoiGian) - new Date(b.thoiGian));
xepNgay();

// Dòng tháng cố định trên đầu bảng luôn hiện tháng của khoản đang nằm ngay dưới nó
function capNhatThang() {
  const th = document.getElementById('thang');
  const duoi = document.querySelector('tr.r-cols th').getBoundingClientRect().bottom;
  const dong = [...document.querySelectorAll('#list tr')].find(tr => tr.getBoundingClientRect().bottom > duoi + 1);
  const key = dong ? dong.dataset.thang : (items.length ? thangCua(items[items.length - 1].thoiGian) : thangCua(new Date().toISOString()));
  th.textContent = 'Tháng ' + key;
}
window.addEventListener('scroll', capNhatThang, { passive: true });

function capNhatChon() {
  const n = chon.size, btn = document.getElementById('delsel');
  btn.style.display = n ? 'block' : 'none';
  btn.textContent = `Xóa (${n})`;
  const all = document.getElementById('chkall');
  all.checked = n > 0 && n === items.length;
  all.indeterminate = n > 0 && n < items.length;
}

// Gom theo tháng (items đã xếp theo ngày): [{ key, ds: [item...], tong }]
function nhomThang() {
  const nhom = [];
  for (const it of items) {
    const key = thangCua(it.thoiGian);
    let g = nhom[nhom.length - 1];
    if (!g || g.key !== key) nhom.push(g = { key, ds: [], tong: 0 });
    g.ds.push(it); g.tong += it.soTien;
  }
  return nhom;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const nhom = nhomThang();
  nhom.forEach((g, gi) => {
    if (gi > 0) {                                              // sang tháng mới: dòng ngăn
      const sep = document.createElement('tr');
      sep.className = 'sep'; sep.dataset.thang = g.key;
      sep.innerHTML = `<td colspan="6">Tháng ${g.key}</td>`;
      list.appendChild(sep);
    }
    g.ds.forEach((it, i) => {
      const tr = document.createElement('tr');
      tr.dataset.thang = g.key;
      tr.innerHTML = `<td class="c"><input type="checkbox" ${chon.has(it.id) ? 'checked' : ''}></td><td class="c">${i + 1}</td>
        <td class="c" contenteditable inputmode="numeric">${ngay(it.thoiGian)}</td>
        <td class="nguon c"><span class="ng-hien"></span><select class="ng-chon"></select></td>
        <td contenteditable>${esc(it.noiDung)}</td>
        <td class="money" contenteditable inputmode="numeric">${fmt(it.soTien)}</td>`;
      const [ck, , dt, ng, nd, st] = tr.children;
      const hien = ng.querySelector('.ng-hien');
      // chỉ hiện 3 ký tự đầu cho gọn
      const veHien = () => { hien.textContent = Array.from((it.nguon || '').normalize('NFC')).slice(0, 3).join('') || '–'; hien.classList.toggle('trong', !it.nguon); };
      veHien();
      ganNguon(ng.querySelector('select'), it.nguon, v => { it.nguon = v; save(); veHien(); });
      ck.onclick = e => { if (e.target !== ck.firstChild) ck.firstChild.click(); };
      ck.firstChild.onchange = e => { e.target.checked ? chon.add(it.id) : chon.delete(it.id); capNhatChon(); };
      dt.onblur = () => {
        const d = parseNgay(dt.textContent, it.thoiGian);
        if (d) { it.thoiGian = d.toISOString(); xepNgay(); save(); }
        render();                                           // sai định dạng thì hiện lại ngày cũ
      };
      nd.onblur = () => {
        const moi = nd.textContent.trim();
        if (moi !== it.noiDung) learnFix(it.noiDung, moi);   // nhớ cách sửa cho lần sau
        it.noiDung = moi; save();
      };
      st.onblur = () => { it.soTien = Number(st.textContent.replace(/\D/g, '')) || 0; save(); render(); };
      list.appendChild(tr);
    });
    const tong = document.createElement('tr');                // tổng riêng của tháng
    tong.className = 'tong'; tong.dataset.thang = g.key;
    tong.innerHTML = `<td colspan="5">Tổng tháng ${g.key}</td><td class="money">${fmt(g.tong)}</td>`;
    list.appendChild(tong);
  });
  // Tổng cộng chỉ cần khi có từ 2 tháng trở lên
  document.querySelector('tfoot').style.display = nhom.length > 1 ? '' : 'none';
  document.getElementById('total').textContent = fmt(items.reduce((s, it) => s + it.soTien, 0));
  capNhatChon();
  capNhatThang();
}

function addText(text) {
  if (!text.trim()) return;
  const r = parseExpense(fixBrands(text));
  items.push({ ...r, id: newId(), thoiGian: new Date().toISOString(), cauGoc: text, nguon: nguonMd });
  xepNgay(); save(); render();
}

// Nhận giọng nói
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic'), micT = document.getElementById('mic-t'), live = document.getElementById('live');
let rec = null, listening = false;
if (!SR) {
  mic.disabled = true; micT.textContent = 'Không hỗ trợ giọng nói';
} else {
  rec = new SR();
  rec.lang = 'vi-VN';
  rec.interimResults = true;
  // iPhone: nghe liên tục chạy không ổn định -> mỗi lần bấm ghi 1 khoản
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  rec.continuous = !isIOS;
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { addText(t); live.textContent = ''; }
      else live.textContent = t;
    }
  };
  rec.onend = () => {
    if (listening && !isIOS) return rec.start();       // Android: tự bật lại khi trình duyệt ngắt
    listening = false; mic.classList.remove('on'); micT.textContent = 'Bấm để nói';
  };
  rec.onerror = e => {
    if (e.error === 'service-not-allowed' || e.error === 'not-allowed') {
      // iOS chặn nhận giọng của web -> dùng micro của bàn phím iPhone
      listening = false;
      live.textContent = 'iPhone chặn nhận giọng trên web. Bấm vào ô bên dưới, chọn biểu tượng micro trên bàn phím để đọc, rồi bấm Xong.';
      document.getElementById('manual').focus();
    } else live.textContent = 'Lỗi: ' + e.error;
  };
  mic.onclick = () => {
    listening = !listening;
    mic.classList.toggle('on', listening);
    micT.textContent = listening ? 'Đang nghe...' : 'Bấm để nói';
    listening ? rec.start() : rec.stop();
  };
}

// Quét ảnh hóa đơn / chuyển khoản: đọc chữ ngay trên máy (Tesseract), sau đó cho Hoan xem lại
const taiScript = src => new Promise((ok, loi) => {
  const el = document.createElement('script');
  el.src = src; el.onload = ok; el.onerror = () => loi(new Error('Không tải được ' + src));
  document.head.appendChild(el);
});
let worker = null, tienDo = () => {};
async function lamViecVoiTesseract() {
  if (!worker) {
    if (!window.Tesseract) await taiScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
    worker = await Tesseract.createWorker('vie', 1, { logger: m => tienDo(m) });
  }
  return worker;
}
// Đọc cả ảnh: trả về các dòng chữ kèm vị trí (bỏ dòng trống)
async function docChu(canvas) {
  const w = await lamViecVoiTesseract();
  const { data } = await w.recognize(canvas);
  const lines = (data.lines || []).map(l => ({ t: l.text.trim(), bbox: l.bbox })).filter(l => l.t);
  return { text: data.text, lines };
}
// Đọc lại riêng một dòng: cắt, phóng to, đảo màu nếu nền tối, tăng tương phản. Chữ to trên nền xanh/ảnh đọc đúng hơn hẳn.
function chuanBiDong(canvas, b) {
  const rong = b.x1 - b.x0, cao = b.y1 - b.y0, padY = Math.round(cao * 0.4), padX = Math.round(rong * 0.6);
  const x0 = Math.max(0, b.x0 - padX), x1 = Math.min(canvas.width, b.x1 + padX);
  const y0 = Math.max(0, b.y0 - padY), y1 = Math.min(canvas.height, b.y1 + padY);
  const k = Math.min(2, 3000 / (x1 - x0));
  const c = document.createElement('canvas');
  c.width = Math.round((x1 - x0) * k); c.height = Math.round((y1 - y0) * k);
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(canvas, x0, y0, x1 - x0, y1 - y0, 0, 0, c.width, c.height);
  const img = g.getImageData(0, 0, c.width, c.height), d = img.data, n = d.length / 4;
  const xam = new Float32Array(n);
  let tong = 0;
  for (let i = 0; i < n; i++) { xam[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]; tong += xam[i]; }
  const toi = tong / n < 128;                                    // nền tối, chữ sáng -> đảo lại
  const hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) { if (toi) xam[i] = 255 - xam[i]; hist[Math.round(xam[i])]++; }
  const phanVi = p => { let acc = 0; for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= n * p) return v; } return 255; };
  const lo = phanVi(0.02), hi = Math.max(lo + 1, phanVi(0.98));
  for (let i = 0; i < n; i++) {
    const v = Math.max(0, Math.min(255, (xam[i] - lo) / (hi - lo) * 255));
    d[4 * i] = d[4 * i + 1] = d[4 * i + 2] = v; d[4 * i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
const soTu = t => t.split(/\s+/).filter(w => (w.match(/\p{L}/gu) || []).length >= 2).length;   // đọc lại mà dính chữ thì không nhận
async function docLaiDong(canvas, bbox) {
  const w = await lamViecVoiTesseract();
  await w.setParameters({ tessedit_pageseg_mode: '7' });         // một dòng duy nhất
  try { return (await w.recognize(chuanBiDong(canvas, bbox))).data.text.trim(); }
  finally { await w.setParameters({ tessedit_pageseg_mode: '6' }); }   // 6 là chế độ mặc định của lần đọc cả ảnh
}
// Thu nhỏ ảnh (ảnh iPhone rất lớn, đọc chậm) và tự xoay đúng chiều
async function thuNho(file, max = 1800) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}

const $ = id => document.getElementById(id);
$('scan').onclick = () => $('anh').click();

// Đọc một ảnh -> { r: kết quả đoán, text: chữ máy đọc được }
async function quetMotAnh(file) {
  const canvas = await thuNho(file);
  const { lines } = await docChu(canvas);
  let r = parseBill(lines.map(l => l.t));
  // Đọc lại riêng dòng số tiền và dòng tên người nhận để chính xác hơn
  for (const i of [r.dong, ...r.dongTen]) {
    if (i === null || !lines[i]) continue;
    const t = await docLaiDong(canvas, lines[i].bbox);
    const laSo = i === r.dong;
    // Chỉ nhận kết quả đọc lại khi trông hợp lý (số tiền: đúng 1 số; tên: không dính chữ, không thêm rác)
    const hopLy = laSo ? (soTrongDong(t).length === 1 && t.length < 40)
                       : (t.length >= 3 && hoaRatio(t) >= hoaRatio(lines[i].t) - 0.05 && soTu(t) >= soTu(lines[i].t));
    if (hopLy) lines[i].t = t;
  }
  r = parseBill(lines.map(l => l.t));
  return { r, text: lines.map(l => l.t).join('\n'), anh: await luuAnh(canvas) };
}

// Giữ ảnh đã thu nhỏ (JPEG nhẹ) + ảnh bé làm hình đại diện, để đối chiếu với kết quả đọc được
const canvasRaBlob = (c, q) => new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
async function luuAnh(canvas) {
  const nho = document.createElement('canvas');
  const k = Math.min(1, 160 / Math.max(canvas.width, canvas.height));
  nho.width = Math.round(canvas.width * k); nho.height = Math.round(canvas.height * k);
  nho.getContext('2d').drawImage(canvas, 0, 0, nho.width, nho.height);
  const [full, thumb] = await Promise.all([canvasRaBlob(canvas, 0.8), canvasRaBlob(nho, 0.7)]);
  return { full: URL.createObjectURL(full), thumb: URL.createObjectURL(thumb) };
}
function boThe(the) {                                       // gỡ thẻ và giải phóng ảnh
  if (the._anh) { URL.revokeObjectURL(the._anh.full); URL.revokeObjectURL(the._anh.thumb); }
  the.remove();
}
function donThe() { [...$('x-ds').children].forEach(boThe); }
$('phong-anh').onclick = e => e.target.classList.toggle('zoom');
$('phong-dong').onclick = () => { $('phong').classList.remove('mo'); $('phong-anh').classList.remove('zoom'); };

$('anh').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';                                    // cho phép chọn lại cùng một ảnh
  if (!files.length) return;
  const live = $('live');
  donThe();
  for (const [k, file] of files.entries()) {
    const dau = files.length > 1 ? `Ảnh ${k + 1}/${files.length}: ` : '';
    tienDo = m => { live.textContent = dau + (m.status === 'recognizing text' ? `đang đọc... ${Math.round(m.progress * 100)}%` : 'đang tải dữ liệu đọc chữ (lần đầu hơi lâu)...'); };
    live.textContent = dau + 'đang chuẩn bị...';
    try {
      const { r, text, anh } = await quetMotAnh(file);
      themThe(k + 1, r, text, files.length > 1, '', anh);
    } catch (err) {
      themThe(k + 1, { noiDung: '', soTien: 0, ngay: null }, '', files.length > 1, 'Không đọc được ảnh này: ' + err.message);
    }
    // Tesseract tự "học" theo ảnh đã đọc nên kết quả ảnh sau bị lệch; đọc xong thì bỏ đi, ảnh sau tạo mới (dữ liệu tiếng Việt đã được lưu sẵn)
    if (worker) { worker.terminate(); worker = null; }
  }
  live.textContent = '';
  $('xem').classList.add('mo');
};

// Mỗi ảnh một thẻ để xem lại / sửa / bỏ
function themThe(stt, r, text, nhieu, loi, anh) {
  const hom = new Date();
  const ngay = r.ngay ? `${pad(r.ngay.d)}/${pad(r.ngay.m)}/${r.ngay.y}` : `${pad(hom.getDate())}/${pad(hom.getMonth() + 1)}`;
  const the = document.createElement('div');
  the.className = 'the';
  the._anh = anh;
  the.innerHTML = `<div class="the-dau">${anh ? `<img class="the-anh" src="${anh.thumb}" alt="Ảnh ${stt}">` : ''}<span class="the-tieu">${nhieu ? 'Ảnh ' + stt : 'Ảnh quét'}${anh ? '<br><small style="color:#888;font-weight:normal">Chạm vào ảnh để xem lớn</small>' : ''}</span><button class="bo">${nhieu ? 'Bỏ ảnh này' : ''}</button></div>
    <label>Nội dung</label><input class="nd">
    <label>Số tiền</label><input class="st" inputmode="numeric">
    <label>Ngày (dd/mm hoặc dd/mm/yyyy)</label><input class="ngay" inputmode="numeric">
    <label>Nguồn tiền</label><select class="the-nguon"></select>
    <div class="loi"></div>
    <details style="margin-top:8px"><summary style="font-size:13px;color:#666">Chữ máy đọc được</summary><pre></pre></details>`;
  the.querySelector('.nd').value = r.noiDung;
  the.querySelector('.st').value = r.soTien ? fmt(r.soTien) : '';
  the.querySelector('.ngay').value = ngay;
  the.dataset.nguon = nguonMd;                             // thẻ mới lấy nguồn mặc định, sửa được từng thẻ
  ganNguon(the.querySelector('.the-nguon'), nguonMd, v => { the.dataset.nguon = v; });
  the.querySelector('.loi').textContent = loi || (r.soTien ? '' : 'Không tìm thấy số tiền, Hoan nhập tay giúp mình.');
  the.querySelector('pre').textContent = text.trim() || '(không đọc được chữ nào)';
  the.querySelector('.bo').onclick = () => { boThe(the); if (!$('x-ds').children.length) $('xem').classList.remove('mo'); };
  const hinh = the.querySelector('.the-anh');
  if (hinh) hinh.onclick = () => { $('phong-anh').src = anh.full; $('phong-anh').classList.remove('zoom'); $('phong').classList.add('mo'); };
  $('x-ds').appendChild(the);
}

$('x-huy').onclick = () => { donThe(); $('xem').classList.remove('mo'); };
$('x-them').onclick = () => {
  for (const the of [...$('x-ds').children]) {
    const nd = the.querySelector('.nd').value.trim();
    const st = Number(the.querySelector('.st').value.replace(/\D/g, '')) || 0;
    const d = parseNgay(the.querySelector('.ngay').value, new Date().toISOString());
    const loi = the.querySelector('.loi');
    if (!nd || !st) { loi.textContent = 'Cần có Nội dung và Số tiền.'; continue; }
    if (!d) { loi.textContent = 'Ngày chưa đúng, vd 23/10 hoặc 23/10/2026.'; continue; }
    items.push({ id: newId(), noiDung: nd, soTien: st, thoiGian: d.toISOString(), cauGoc: 'quét ảnh', nguon: the.dataset.nguon || '' });
    boThe(the);                                            // thẻ nào hợp lệ thì thêm và bỏ khỏi danh sách, thẻ lỗi ở lại để sửa
  }
  xepNgay(); save(); render();
  if (!$('x-ds').children.length) $('xem').classList.remove('mo');
};


// Quản lý danh sách nguồn tiền: đổi tên (cập nhật mọi dòng đang dùng), xóa, thêm
function veDanhSachNguon() {
  const ds = document.getElementById('ql-ds');
  ds.innerHTML = '';
  nguonDs.forEach(ten => {
    const d = document.createElement('div');
    d.className = 'ql-dong';
    d.innerHTML = '<input><button aria-label="Xóa">×</button>';
    const inp = d.querySelector('input');
    inp.value = ten;
    inp.onchange = () => {
      const moi = inp.value.trim();
      if (!moi || (moi !== ten && nguonDs.some(n => n.toLowerCase() === moi.toLowerCase()))) { inp.value = ten; return; }
      nguonDs[nguonDs.indexOf(ten)] = moi;
      items.forEach(it => { if (it.nguon === ten) it.nguon = moi; });
      if (nguonMd === ten) nguonMd = moi;
      luuNguon(); save(); lamMoiNguon(); veDanhSachNguon();
    };
    d.querySelector('button').onclick = () => {
      const dung = items.filter(it => it.nguon === ten).length;
      if (!confirm(dung ? `"${ten}" đang dùng ở ${dung} dòng. Xóa khỏi danh sách (các dòng đó vẫn giữ tên)?` : `Xóa "${ten}" khỏi danh sách?`)) return;
      nguonDs = nguonDs.filter(n => n !== ten);
      if (nguonMd === ten) nguonMd = '';
      luuNguon(); lamMoiNguon(); veDanhSachNguon();
    };
    ds.appendChild(d);
  });
}
document.getElementById('ng-sua').onclick = () => { veDanhSachNguon(); document.getElementById('ql').classList.add('mo'); };
document.getElementById('ql-xong').onclick = () => document.getElementById('ql').classList.remove('mo');
document.getElementById('ql-them').onclick = () => {
  const inp = document.getElementById('ql-moi');
  if (themNguon(inp.value) !== null) { inp.value = ''; lamMoiNguon(); veDanhSachNguon(); }
};

// Xuất Excel: mỗi tháng một nhóm (STT bắt đầu từ 1) kèm dòng tổng tháng
document.getElementById('export').onclick = () => {
  const aoa = [['STT', 'Ngày', 'Nguồn tiền', 'Nội dung', 'Số tiền']];
  const ngayCells = [], tienCells = [];                    // [chỉ số dòng] cần định dạng
  const nhom = nhomThang();
  nhom.forEach((g, gi) => {
    if (gi > 0) aoa.push([]);
    aoa.push([`Tháng ${g.key}`]);
    g.ds.forEach((it, i) => {
      const d = new Date(it.thoiGian);
      // Ngày thật của Excel (lọc/sắp xếp được), hiển thị dd/mm
      const serial = (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000;
      aoa.push([i + 1, serial, it.nguon || '', it.noiDung, it.soTien]);
      ngayCells.push(aoa.length); tienCells.push(aoa.length);
    });
    aoa.push(['', '', '', `Tổng tháng ${g.key}`, g.tong]); tienCells.push(aoa.length);
  });
  if (nhom.length > 1) {
    aoa.push([]);
    aoa.push(['', '', '', 'Tổng cộng', items.reduce((s, it) => s + it.soTien, 0)]); tienCells.push(aoa.length);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 5 }, { wch: 8 }, { wch: 14 }, { wch: 35 }, { wch: 15 }];
  ngayCells.forEach(r => { ws['B' + r].z = 'dd/mm'; });
  tienCells.forEach(r => { ws['E' + r].z = '#,##0'; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Chi tiêu');
  XLSX.writeFile(wb, `chi-tieu-${new Date().toISOString().slice(0, 10)}.xlsx`);
};

lamMoiNguon();
